# Local dev environment. From the repo root:
#   docker compose up -d          # pull (first time) + start everything — no image build, ever
#   docker compose logs -f jupyter
#   docker compose down           # stop (add -v to also wipe the Airflow metadata DB + JS/Python caches)
#
# JupyterLab is served automatically at http://localhost:8889/lab — no token.
# (Host ports are offset from the JupyterLab defaults — 8889/9998 instead of
# 8888/9999 — so this stack can run alongside jupyterlab-db-explorer's, which
# already claims 8888/9999 for its own jupyter service.)
# The `jupyter` service runs a pre-built, off-the-shelf Python+Node image
# (nikolaik/python-nodejs) unmodified — there is no Dockerfile and nothing to
# build, locally or in CI. Everything project-specific happens at container
# start via docker/entrypoint.sh: it (re)installs JS and Python dependencies
# from whatever is currently on disk, then runs `jlpm watch` (frontend) and
# `jupyter lab --autoreload` (backend) so both sides pick up source changes
# live, no restart needed.
#
# The Airflow service is controlled via a Docker Compose profile so it can be
# turned off when you only need the JupyterLab dev container (e.g. to target a
# remote Airflow instead). Enable/disable it in .env by editing
# COMPOSE_PROFILES.
#
# See docker/README.md for details.

services:
  # Airflow's metadata database. NOT a convenience — a correctness fix. Airflow
  # standalone defaults to SQLite, which allows a single writer, and with
  # LocalExecutor the scheduler, dag-processor and api-server all contend for
  # it. Under real editing load that contention killed the scheduler here with
  # `sqlite3.OperationalError: database is locked`; standalone did not restart
  # it, so for ~14h DAGs deployed and registered but silently never ran, while
  # the container still reported healthy. Postgres removes the contention.
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      # First start runs initdb and then waits for the server to come up. The
      # image's default 60s was not enough on Docker Desktop's named-volume I/O
      # here — initdb succeeded but `pg_ctl` timed out and the container exited.
      PGCTLTIMEOUT: '300'
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U airflow -d airflow']
      interval: 10s
      timeout: 5s
      retries: 10
    profiles:
      - airflow

  airflow:
    image: apache/airflow:3.0.2
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
    ports:
      # Host 8080 is often taken (e.g. an MCP server); map the UI to 8081 on the
      # host. Inside the compose network Airflow is still reached at airflow:8080.
      - 0.0.0.0:8081:8080
    environment:
      # Point Airflow at the Postgres above instead of the default SQLite (see
      # the airflow-db service for why). LocalExecutor is only safe to run this
      # way with a real concurrent-writer database.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      # Example DAGs are OFF: several of Airflow 3.0.2's bundled examples import
      # a test-only `tests_common` module that is not in the published wheel,
      # which surfaces as a spurious import error. The deployed DAGs in
      # docker/airflow-dags/ are the "something to show" instead.
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # Deterministic credentials for the SimpleAuthManager (admin / admin).
      # The password file is pre-seeded and mounted below; without this Airflow
      # would generate a random password on every start.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
      # Stable JWT signing secret so tokens survive restarts.
      AIRFLOW__API_AUTH__JWT_SECRET: dev-jwt-secret-change-me
      # Provider packages the operator registry needs but the base image omits,
      # so every palette node is enabled instead of dimmed (PRD §6.2.1 gating
      # reads GET /api/v2/providers from THIS container). The other ten the
      # registry requires — amazon, cncf-kubernetes, common-sql, ftp, google,
      # http, sftp, slack, smtp, standard — already ship in apache/airflow:3.0.2.
      #
      # Versions are pinned to what the official 3.0.2 constraints resolve to
      # (constraints-3.0.2/constraints-3.12.txt), so a rebuild-free `up` stays
      # reproducible instead of drifting onto a future incompatible release.
      # The image entrypoint installs these at container start — no image build.
      # Cost lands on a container RECREATE, not a `restart` (which keeps the
      # writable layer, so pip just reports "already satisfied"); see the pip
      # cache mount below for the measured numbers.
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        apache-airflow-providers-apache-spark==5.3.0
        apache-airflow-providers-apprise==2.1.0
        apache-airflow-providers-discord==3.10.0
        apache-airflow-providers-imap==3.9.0
        apache-airflow-providers-opsgenie==5.9.0
        apache-airflow-providers-papermill==3.11.0
        apache-airflow-providers-telegram==4.8.0
    volumes:
      - ./docker/airflow-dags:/opt/airflow/dags
      - ./docker/airflow-config:/opt/airflow/config
      # Airflow's home (logs, config it writes). Named `airflow-home`, not
      # `airflow-db` as before — the metadata DB now lives in Postgres, and a
      # volume sharing a name with the `airflow-db` *service* reads as if this
      # were that database.
      - airflow-home:/opt/airflow
      # pip's download+wheel cache. The providers above reinstall whenever the
      # container is RECREATED (a plain restart keeps the writable layer, so
      # pip just says "already satisfied"), and one of them — apache-spark —
      # pulls pyspark, which ships no matching wheel and is BUILT from source.
      # Measured here: ~1630s to recreate on an empty cache vs ~236s once the
      # built wheel is cached.
      #
      # Two non-obvious details, both learned by watching it silently cache
      # nothing: the path is NOT ~/.cache — this image sets
      # PIP_CACHE_DIR=/tmp/.cache/pip — and it must be a BIND mount, because a
      # fresh named volume is created root-owned while the container runs as
      # uid 50000, which then cannot write into it. A bind mount takes the host
      # directory's permissions instead. It is a pure cache, so it shadows
      # nothing (unlike mounting a site-packages/prefix path, which is why
      # Airflow's own install dir is deliberately left alone).
      - ./docker/airflow-pip-cache:/tmp/.cache
    healthcheck:
      # Checks the API server AND the scheduler. The API-server-only check used
      # to report "healthy" while the scheduler was dead — the worst possible
      # signal, because DAGs still deploy and register, they just never run.
      # `airflow jobs check` fails when no SchedulerJob has heartbeated
      # recently, so that state now shows up as `Up (unhealthy)`.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8080/')" &&
          airflow jobs check --job-type SchedulerJob --limit 1
      interval: 15s
      timeout: 20s
      retries: 20
      start_period: 120s
    profiles:
      - airflow

  jupyter:
    # Pre-built Python 3.12 + Node 22 image (Debian 'buildpack-deps' base, so
    # git/build tooling is already there) — pulled from Docker Hub, never built.
    # https://github.com/nikolaik/docker-python-nodejs
    image: nikolaik/python-nodejs:python3.12-nodejs22
    # The image's default user (`pn`) can't write the root-owned named volumes
    # below without sudo, which isn't installed; running as root sidesteps
    # that entirely — fine for a disposable local dev container.
    user: root
    entrypoint: ["bash", "/workspace/docker/entrypoint.sh"]
    volumes:
      - .:/workspace
      # Named volumes so installs stay on the container's own Linux filesystem
      # (avoiding host/container binary mismatches) and persist across
      # `docker compose down` + `up`, instead of living on the bind-mounted
      # (and, on Windows/macOS, cross-platform) workspace or the base image's
      # writable layer.
      - node_modules:/workspace/node_modules
      # /usr/local (Python packages + their /usr/local/bin launcher scripts,
      # plus Node/yarn, which the base image also installs under /usr/local).
      # A first attempt at this broke on the *second* full recreate: pip's
      # uninstall/reinstall dance for jupyterlab_airflow's own editable
      # install collided with `jupyter labextension develop`'s symlink under
      # the persisted /usr/local/share/jupyter/labextensions/. Fixed in
      # docker/entrypoint.sh, which now wipes that package's own install
      # footprint before every `pip install -e .` so it's always a clean
      # install rather than an uninstall+rollback — see the comment there.
      - usr-local:/usr/local
      # Optional: point HOST_SSH_DIR (in .env) at your real ~/.ssh to use
      # your own keys for git inside the container. Defaults to an empty,
      # gitignored folder so this is a no-op out of the box.
      - ${HOST_SSH_DIR}:/root/.ssh:ro
    working_dir: /workspace
    ports:
      # Host ports offset from the container's own 8888/9999 (see the top-of-
      # file note) to avoid colliding with another docker-compose project's
      # jupyter service on the same host.
      - 0.0.0.0:8889:8888
      - 0.0.0.0:9998:9999
    environment:
      # Where the server extension reaches Airflow. Inside the compose network
      # the Airflow API server is at http://airflow:8080.
      AIRFLOW_API_URL: http://airflow:8080
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin
      # Deploy target: the same host docker/airflow-dags/ folder Airflow reads
      # from /opt/airflow/dags, reachable here under the mounted workspace.
      AIRFLOW_DAGS_DIR: /workspace/docker/airflow-dags
    depends_on:
      airflow:
        condition: service_started
        required: false

volumes:
  airflow-pgdata:
  airflow-home:
  node_modules:
  usr-local:
